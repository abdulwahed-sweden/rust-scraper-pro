[package]
name = "rust-scraper-pro"
version = "0.1.0"
edition = "2024"
description = "A professional web scraping library built in Rust"
authors = ["abdulwahed-sweden"]
license = "MIT"
repository = "https://github.com/abdulwahed-sweden/rust-scraper-pro.git"

[dependencies]
reqwest = { version = "0.13.4", features = ["json", "stream"] }
tokio = { version = "1.52.3", features = ["full"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34+deprecated"
toml = "1.1.2+spec-1.1.0"
csv = "1.4.0"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio-rustls",
  "postgres",
  "sqlite",
  "chrono",
] }
anyhow = "1.0.103"
thiserror = "2.0.18"
log = "0.4.33"
env_logger = "0.11.11"
futures = "0.3.32"
async-trait = "0.1.89"
url = "2.5.8"
regex = "1.12.4"
lazy_static = "1.5.0"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23.4", features = ["v4"] }
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "fs", "trace"] }
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
hyper = "1.10.1"
rustls = "0.23.41"
serde_urlencoded = "0.7.1"
moka = { version = "0.12.15", features = ["sync", "future"] }
md5 = "0.8.0"
# AI/ML integration
bytes = "1.12.1"
parking_lot = "0.12.5"

[dev-dependencies]
tokio-test = "0.4.5"
mockito = "1.7.2"
